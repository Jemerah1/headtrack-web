<!DOCTYPE html>
<html lang="tr">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head Tracker</title>
    <style>
        #imlec {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: red;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <h1>Head Tracker</h1>

    <p id="status">Hazır</p>
    <p id="Acılar">Yaw: - | Pitch: - | Roll: - </p>
    <p id="fareDurum">Gerçek fare: kapalı (M tuşu)</p>

    <button id="startButton">Başlat </button>
    <button id="cameraButton">Kamerayı aç</button>
    <button id="resetAxesButton">Ekseni Sıfırla </button>

    <video id="video" autoplay playsinline> </video>

    <canvas id="canvas"> </canvas>

    <div id="imlec"> </div>

    <select id="cameraSelect"> </select>

    <script type="module">

        import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0";

        // ----------------- TANIMLAMALAR -----------------
        let faceLandmarker = null;
        let stream = null;
        const video = document.getElementById('video');
        const statusText = document.getElementById('status')
        const cameraSelect = document.getElementById('cameraSelect');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const drawingUtils = new DrawingUtils(ctx);
        const startButton = document.getElementById('startButton');
        const cameraButton = document.getElementById('cameraButton');
        const angleText = document.getElementById('Acılar');
        const fareDurum = document.getElementById('fareDurum');
        let soket = null;
        let gercekfare = false;

        const imlec = document.getElementById('imlec');
        imlec.style.display = 'none';
        const MAX_YAW = 30;
        const MAX_PITCH = 20;
        const YON_X = 1;
        const YON_Y = 1;
        const OLU_BOLGE = 2;
        const YUMUSAKLIK = 0.2;
        // ----------------- TANIMLAMALAR -----------------

        let sonAcilar = { yaw: 0, pitch: 0, roll: 0 };
        let merkez = { yaw: 0, pitch: 0, roll: 0 };
        let yumusakYaw = 0;
        let yumusakPitch = 0;

        let isTracking = false;
        async function startTracking() {
            if (isTracking) {
                console.log('Zaten Takip Ediliyor');
                return;

            }
            console.log('Takip Başlatıldı');

            if (stream === null) {
                console.log('Kamera Yok');
                setStatus('Kamera Henüz Açılmadı', 'orange');
                return;
            }

            isTracking = true;
            startButton.textContent = 'Durdur';
            imlec.style.display = 'block';

            if (faceLandmarker === null) {
                setStatus('Model yükleniyor...', 'gray')
                await loadModel();
                setStatus('Model Hazır', 'green')
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            trackLoop();
        }

        function stopTracking() {
            isTracking = false;
            startButton.textContent = 'Başlat';
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            imlec.style.left = '50%';
            imlec.style.top = '50%';
            imlec.style.display = 'none';

            yumusakYaw = 0;
            yumusakPitch = 0;

            setStatus('Takip Durduruldu', 'gray');
            console.log('Takip Durduruldu');
        }

        let lastVideoTime = -1;
        function trackLoop() {
            if (!isTracking) {
                return;
            }

            if (video.currentTime !== lastVideoTime) {
                const results = faceLandmarker.detectForVideo(video, performance.now());
                lastVideoTime = video.currentTime;
                results.faceLandmarks.length > 0 ? setStatus('Yüz Bulundu', 'green') : setStatus('Yüz Bulunamadı', 'red');
                ctx.clearRect(0, 0, canvas.width, canvas.height)

                for (const landmarks of results.faceLandmarks) {
                    drawingUtils.drawConnectors(
                        landmarks,
                        FaceLandmarker.FACE_LANDMARKS_TESSELATION,
                        { color: "#C0C0C070", lineWidth: 1 }
                    );
                    if (results.facialTransformationMatrixes) {
                        const matris = results.facialTransformationMatrixes[0];
                        sonAcilar = matrisiAciyaCevir(matris.data);

                        const yaw = sonAcilar.yaw - merkez.yaw;
                        const pitch = sonAcilar.pitch - merkez.pitch;
                        const roll = sonAcilar.roll - merkez.roll;

                        yumusakYaw += (oluBolge(yaw) - yumusakYaw) * YUMUSAKLIK;
                        yumusakPitch += (oluBolge(pitch) - yumusakPitch) * YUMUSAKLIK;

                        imlecGuncelle(yumusakYaw, yumusakPitch);

                        angleText.textContent =
                            `Yaw: ${yaw.toFixed(1)} | Pitch: ${pitch.toFixed(1)} | Roll: ${roll.toFixed(1)}`;
                    }
                }

            }
            requestAnimationFrame(trackLoop);
        }

        function matrisiAciyaCevir(d) {
            const radyanToDerece = 180 / Math.PI;

            const pitch = Math.asin(-d[9]) * radyanToDerece;
            const yaw = Math.atan2(d[8], d[10]) * radyanToDerece;
            const roll = Math.atan2(d[1], d[5]) * radyanToDerece;

            return { yaw, pitch, roll };
        }

        function imlecGuncelle(yaw, pitch) {

            let oranX = (yaw / MAX_YAW) * YON_X;
            let oranY = (pitch / MAX_PITCH) * YON_Y;

            oranX = Math.max(-1, Math.min(1, oranX));
            oranY = Math.max(-1, Math.min(1, oranY));

            if (gercekFare && soket !== null && soket.readyState === WebSocket.OPEN) {
                soket.send(JSON.stringify({ x: oranX, y: oranY }));
            }

            const x = window.innerWidth / 2 + oranX * (window.innerWidth / 2);
            const y = window.innerHeight / 2 + oranY * (window.innerHeight / 2);

            imlec.style.left = x + 'px';
            imlec.style.top = y + 'px';
        }

        function oluBolge(deger) {
            if (Math.abs(deger) < OLU_BOLGE) {
                return 0;
            }
            return deger - Math.sign(deger) * OLU_BOLGE;
        }

        function soketBaglan() {
            soket = new WebSocket('ws://localhost:8765');

            soket.onclose = function () {
                soket = null;
                gercekfare = false;
                fareDurum.textContent = 'Gerçek fare: kapalı (Program bağlı değil, M tuşu)';
                console.log('Soket kapandı');
            }
        }

        function resetAxes() {
            merkez = { ...sonAcilar };
            console.log('Eksen Sıfırlandı');
            setStatus('Eksen Sıfırlandı', 'green');
        }

        async function cameraToggle() {

            if (stream === null) {
                try {

                    await startCamera();
                    console.log('Kamera Açıldı');
                    setStatus('Kamera Açıldı', 'green')
                    cameraButton.textContent = 'Kamerayı Kapat';
                    if (cameraSelect.value === '') {
                        await listCameras();
                    }

                }

                catch (error) {
                    console.error('Kamera açılamadı:', error);
                    setStatus('Kamera Açılamadı', 'red')
                }
            }
            else {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.srcObject = null;
                console.log('Kamera Kapatıldı');
                stopTracking();
                setStatus('Kamera Kapatıldı', 'gray')
                cameraButton.textContent = 'Kamerayı Aç';

            }

        }

        async function startCamera() {
            const kisitlamalar = cameraSelect.value === ''
                ? { video: true }
                : { video: { deviceId: { exact: cameraSelect.value } } };
            stream = await navigator.mediaDevices.getUserMedia(kisitlamalar);
            video.srcObject = stream;
            console.log('Seçilen Kamera:', stream.getVideoTracks()[0].label);
        }

        async function loadModel() {

            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.0/wasm"
            );
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
                },
                runningMode: "VIDEO",
                numFaces: 1,
                outputFacialTransformationMatrixes: true
            });
            console.log('Model Yüklendi');
        }

        async function listCameras() {
            const cihazlar = await navigator.mediaDevices.enumerateDevices();
            const kameralar = cihazlar.filter(kamera => kamera.kind === 'videoinput');
            console.log('Kameralar:', kameralar);

            cameraSelect.innerHTML = '';

            kameralar.forEach(kamera => {
                const option = document.createElement('option');
                option.value = kamera.deviceId;
                option.text = kamera.label || `Kamera ${cameraSelect.length + 1}`;
                cameraSelect.appendChild(option);
            });
            if (stream !== null) {
                cameraSelect.value = stream.getVideoTracks()[0].getSettings().deviceId;
            }
        }


        document.getElementById('startButton').addEventListener('click', function () {
            if (isTracking) {
                stopTracking();
            } else {
                startTracking();
            }

        });

        document.getElementById('cameraButton').addEventListener('click', function () {
            cameraToggle();
        });

        document.getElementById('resetAxesButton').addEventListener('click', function () {
            resetAxes();
        });


        function setStatus(text, color) {
            if (statusText.textContent === text) {
                return;
            }
            statusText.textContent = text;
            statusText.style.color = color;
        }

        cameraSelect.addEventListener('change', async function () {
            if (stream !== null) {
                stream.getTracks().forEach(track => track.stop());
                await startCamera();
            }

        });

        document.addEventListener('keydown', function (e) {
            if (e.code !== 'KeyM') {
                return;
            }
            gercekFare = !gercekFare;
            if (gercekFare && soket === null) {
                soketBaglan();
            }
            fareDurum.textContent = gercekFare
                ? 'Gerçek fare: AÇIK (kapatmak için M)'
                : 'Gerçek fare: kapalı (M tuşu)';
        });

    </script>
</body>

</html>
